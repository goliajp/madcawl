[package]
name = "madcawl-shell"
description = "The windowless host: loads a page and reads it back as text an agent can act on, or paints it to a PNG"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "madcawl-shell"
path = "src/main.rs"

[dependencies]
madcawl-agent = { path = "../madcawl-agent" }
madcawl-css = { path = "../madcawl-css" }
madcawl-dom = { path = "../madcawl-dom" }
madcawl-form = { path = "../madcawl-form" }
madcawl-html = { path = "../madcawl-html" }
madcawl-layout = { path = "../madcawl-layout" }
madcawl-net = { path = "../madcawl-net" }
madcawl-netd = { path = "../madcawl-netd" }
madcawl-paint = { path = "../madcawl-paint" }
madcawl-str = { path = "../madcawl-str" }
madcawl-wire = { path = "../madcawl-wire" }

[dev-dependencies]
madcawl-mcp = { path = "../madcawl-mcp" }
