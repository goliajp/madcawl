[package]
name = "madcawl-bindings"
description = "DOM bindings over the script engine interface, generated from Web IDL"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# the document's URL, which Location and History read and change, with
# the parser the network stack uses
alt-url = { path = "../../../alt/crates/alt-url" }
# querySelector matches with the cascade's selector matcher
madcawl-css = { path = "../madcawl-css" }
madcawl-dom = { path = "../madcawl-dom" }
# the parser runs scripts as it reaches them (parse.rs)
madcawl-html = { path = "../madcawl-html" }
madcawl-js = { path = "../madcawl-js" }
madcawl-str = { path = "../madcawl-str" }

# the binding tests run on the stub engine
[dev-dependencies]
madcawl-js-stub = { path = "../madcawl-js-stub" }
