[package]
name = "madcawl-net"
description = "The network stack of the network process: URLs, DNS through dnssd, TCP, TLS 1.3 and 1.2 with system trust, HTTP/1.1 with a keep-alive pool, gzip and deflate, cookies, redirects and fetch's main flow"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
alt-url = { path = "../../../alt/crates/alt-url" }
madcawl-brotli = { path = "../madcawl-brotli" }
torajs-flate = { path = "../../../torajs/crates/torajs-flate" }
torajs-http1 = { path = "../../../torajs/crates/torajs-http1" }
# tls12: part of the web still offers nothing newer than TLS 1.2
torajs-tls = { path = "../../../torajs/crates/torajs-tls", features = ["tls12"] }
